# Mapped from the device's local dps and Tuya's QueryThingsDataModel.
# The model also lists dp 10 (temperature) and dp 29 (child lock); the
# device never reports them, so they are left out.
name: Humidifier
products:
  - id: ggz6pllj9icgzxua
    manufacturer: iClima
    model: LUX 7000AW
entities:
  - entity: humidifier
    class: humidifier
    dps:
      - id: 1
        type: boolean
        name: switch
      # Humidistat. "CO" = continuous (no humidistat): exposed as 80%, one
      # step above the highest real level, so "max" means "never stop".
      - id: 101
        type: string
        name: humidity
        range:
          min: 40
          max: 80
        mapping:
          - dps_val: "40RH"
            value: 40
            step: 5
          - dps_val: "45RH"
            value: 45
            step: 5
          - dps_val: "50RH"
            value: 50
            step: 5
          - dps_val: "55RH"
            value: 55
            step: 5
          - dps_val: "60RH"
            value: 60
            step: 5
          - dps_val: "65RH"
            value: 65
            step: 5
          - dps_val: "70RH"
            value: 70
            step: 5
          - dps_val: "75RH"
            value: 75
            step: 5
          - dps_val: "CO"
            value: 80
            step: 5
          # Any other requested value snaps to the nearest multiple of 5.
          - step: 5
      - id: 14
        type: integer
        name: current_humidity
      # Sleep toggle: turning it on drops the mist level to low.
      - id: 16
        type: boolean
        optional: true
        name: mode
        mapping:
          - dps_val: false
            value: normal
          - dps_val: true
            value: sleep
  - entity: fan
    name: Mist level
    icon: "mdi:spray"
    dps:
      # The device ignores level changes while off. Sharing the power DP
      # shows the fan off with the device, and setting a level powers it on.
      - id: 1
        type: boolean
        name: switch
      - id: 103
        type: string
        name: speed
        mapping:
          - dps_val: Low_speed
            value: 25
          - dps_val: Medium_speed
            value: 50
          - dps_val: High_speed
            value: 75
          - dps_val: Turbo_speed
            value: 100
  - entity: select
    name: Light
    icon: "mdi:lightbulb-on-outline"
    category: config
    dps:
      - id: 6
        type: string
        optional: true
        name: option
        mapping:
          - dps_val: Cancel
            value: "Off"
          - dps_val: 7_color_circle
            value: Color cycle
          - dps_val: mint_green
            value: Mint green
          - dps_val: sunset_yellow
            value: Sunset yellow
          - dps_val: orange_yellow
            value: Orange yellow
          - dps_val: cherry_pink
            value: Cherry pink
          - dps_val: sky_blue
            value: Sky blue
          - dps_val: lake_blue
            value: Lake blue
          - dps_val: ice_blue
            value: Ice blue
  - entity: select
    translation_key: timer
    category: config
    dps:
      - id: 19
        type: string
        optional: true
        name: option
        mapping:
          - dps_val: CO
            value: cancel
          - dps_val: 1h
            value: 1h
          - dps_val: 2h
            value: 2h
          - dps_val: 3h
            value: 3h
          - dps_val: 4h
            value: 4h
          - dps_val: 5h
            value: 5h
          - dps_val: 6h
            value: 6h
          - dps_val: 7h
            value: 7h
          - dps_val: 8h
            value: 8h
          - dps_val: 9h
            value: 9h
          - dps_val: 10h
            value: 10h
          - dps_val: 11h
            value: 11h
          - dps_val: 12h
            value: 12h
  - entity: sensor
    translation_key: time_remaining
    class: duration
    category: diagnostic
    dps:
      - id: 20
        type: integer
        optional: true
        name: sensor
        unit: min
  # Water tank: Lack_of_water and Tank_removed both leave the unit without
  # water to work with.
  - entity: binary_sensor
    translation_key: tank_empty
    dps:
      - id: 102
        type: string
        optional: true
        name: sensor
        mapping:
          - dps_val: Water_enough
            value: false
          - value: true
  # Which of the two it is. The data model lists exactly these three values.
  - entity: sensor
    name: Water tank status
    icon: "mdi:cup-water"
    class: enum
    category: diagnostic
    dps:
      - id: 102
        type: string
        optional: true
        name: sensor
        mapping:
          - dps_val: Water_enough
            value: OK
          - dps_val: Lack_of_water
            value: Lack of water
          - dps_val: Tank_removed
            value: Tank removed
  # "Filter lifetime used" in the app; counts up once per hour.
  - entity: sensor
    name: Filter usage
    icon: "mdi:air-filter"
    class: duration
    category: diagnostic
    dps:
      - id: 104
        type: integer
        optional: true
        name: sensor
        unit: h
        class: total_increasing
